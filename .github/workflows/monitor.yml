name: Camera West monitor
on:
  schedule:
    # Wed & Fri daytime, every 5 min (14:00-23:59 UTC = 8am-6pm Mountain)
    - cron: "*/5 14-23 * * 3,5"
    # Wed & Fri evening: after midnight UTC is Thu/Sat, so use days 4,6 (6pm-11pm Mountain)
    - cron: "*/5 0-5 * * 4,6"
    # Quiet/silent releases can land any day, so check hourly otherwise
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 monitor.py
      - name: Save state
        run: |
          git config user.name "monitor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              sleep 3
            done
          fi
      - name: Test notification
        if: github.event_name == 'workflow_dispatch'
        run: |
          curl -s -H "Title: Camera West monitor" -H "Priority: urgent" -d "Test alert - your phone is wired up" "https://ntfy.sh/${{ secrets.NTFY_TOPIC }}"
